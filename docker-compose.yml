services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workfit-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - workfit-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workfit-api
    restart: unless-stopped
    environment:
      API_PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-https://workfit.bluedyso.fr}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-workfit}
      DB_USER: ${DB_USER:-workfit}
      DB_PASSWORD: ${DB_PASSWORD:-workfit}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - workfit-net

  db:
    image: postgres:16-alpine
    container_name: workfit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-workfit}
      POSTGRES_USER: ${DB_USER:-workfit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workfit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-workfit} -d ${DB_NAME:-workfit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workfit-net

volumes:
  postgres_data:

networks:
  workfit-net:
    driver: bridge
