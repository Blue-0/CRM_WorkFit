services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workfit-web
    restart: unless-stopped
    ports:
      - "8453:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - workfit-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workfit-api
    restart: unless-stopped
    environment:
      API_PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-https://workfit.bluedyso.fr}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-workfit}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - workfit-net

networks:
  workfit-net:
    driver: bridge
